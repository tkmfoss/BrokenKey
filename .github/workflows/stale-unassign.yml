name: Tiered Inactivity Auto-Unassign

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  unassign-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Unassign Stale Inactive Claims
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'soc-s1',
              per_page: 100
            });

            // Fetch all currently open PRs directly - avoids Search API indexing lag & rate limits
            const openPRs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              per_page: 100
            });

            const now = new Date();

            for (const issue of issues) {
              if (issue.pull_request || !issue.assignee) continue;

              const assignee = issue.assignee.login;
              const issueNumber = issue.number;

              // Check if the assignee has opened a PR in this repo
              const hasOpenPR = openPRs.some(pr => {
                const prAuthor = pr.user ? pr.user.login.toLowerCase() : '';
                return prAuthor === assignee.toLowerCase();
              });

              if (hasOpenPR) {
                console.log(`Skipping #${issueNumber}: ${assignee} has an open PR`);
                continue;
              }

              // Calculate time since last activity
              const lastUpdated = new Date(issue.updated_at);
              const elapsedHours = (now - lastUpdated) / (1000 * 60 * 60);

              // Tiered deadlines: 3 days (72h) for Easy, 5 days (120h) for Medium/Hard
              const labels = (issue.labels || []).map((l) => typeof l === 'string' ? l : l.name);
              const isEasy = labels.includes('level:easy');
              const maxHours = isEasy ? 72 : 120;
              const maxDays = isEasy ? 3 : 5;

              if (elapsedHours >= maxHours) {
                console.log(`Unassigning ${assignee} from #${issueNumber} (${isEasy ? 'Easy' : 'Med/Hard'}, inactive for ${elapsedHours.toFixed(1)}h / limit ${maxHours}h)`);

                await github.rest.issues.removeAssignees({
                  ...context.repo,
                  issue_number: issueNumber,
                  assignees: [assignee]
                });

                // Tag up-for-grabs so anyone can now claim without author priority restriction
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: issueNumber,
                  labels: ['up-for-grabs']
                });

                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `⏰ @${assignee} has been unassigned due to **${maxDays} days (${maxHours} hours) of inactivity** without an open PR.\n\nThis issue is now tagged \`up-for-grabs\` and available for any eligible contributor to claim with \`/claim\`!`
                });
              }
            }
