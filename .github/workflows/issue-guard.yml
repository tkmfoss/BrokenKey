name: Issue Guard & Anti-Exploit

on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Issue Integrity
        uses: actions/github-script@v7
        with:
          script: |
            const action = context.payload.action;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const actor = context.payload.sender.login.toLowerCase();
            const author = issue.user.login.toLowerCase();
            const assignee = issue.assignee ? issue.assignee.login.toLowerCase() : null;

            const MAINTAINERS = ['ras-al', 'prinzez', 'adwaith620', 'nillubtw', 'antonl-dev', 'hrudulmmn', 'ganes4real'];
            const isMaintainer = MAINTAINERS.includes(actor);

            if (action === 'closed') {
              // 1. Prevent spite-closing: If claimed by another contributor, author/non-maintainer cannot close it
              if (assignee && assignee !== actor && !isMaintainer) {
                console.log(`Unauthorized close of #${issueNumber} by ${actor}. Claimed by ${assignee}. Reopening.`);

                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issueNumber,
                  state: 'open'
                });

                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `⚠️ @${context.payload.sender.login}: This issue cannot be closed while it is actively claimed and assigned to @${issue.assignee.login}.\n\nOnly mentors or the assigned contributor can update the state of an active challenge.`
                });
                return;
              }

              // 2. Author closes issue within 24 hours of creation with no claimer: lock and mark invalid
              if (!assignee && actor === author && !isMaintainer) {
                const createdAt = new Date(issue.created_at);
                const elapsedHours = (new Date() - createdAt) / (1000 * 60 * 60);

                if (elapsedHours <= 24) {
                  console.log(`Issue #${issueNumber} closed by author ${author} within 24h. Locking and marking invalid.`);

                  const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
                  if (!labels.includes('invalid')) {
                    await github.rest.issues.addLabels({
                      ...context.repo,
                      issue_number: issueNumber,
                      labels: ['invalid']
                    });
                  }

                  try {
                    await github.rest.issues.lock({
                      ...context.repo,
                      issue_number: issueNumber,
                      lock_reason: 'resolved'
                    });
                  } catch (e) {
                    console.log('Lock failed:', e.message);
                  }

                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: issueNumber,
                    body: `ℹ️ @${context.payload.sender.login}: This issue was closed by the author within 24 hours of creation with no active claims. It has been marked as \`invalid\` and locked.`
                  });
                  return;
                }
              }

              // 3. Clear any lingering assignees on legitimate close to release claim
              if (issue.assignees && issue.assignees.length > 0) {
                await github.rest.issues.removeAssignees({
                  ...context.repo,
                  issue_number: issueNumber,
                  assignees: issue.assignees.map(a => a.login)
                });
              }
            }

            if (action === 'reopened') {
              // 4. Anti-exploit on reopen: clear assignees and notify that mentor re-approval is required
              if (!isMaintainer) {
                console.log(`Issue #${issueNumber} reopened by ${actor}. Resetting assignees.`);

                if (issue.assignees && issue.assignees.length > 0) {
                  await github.rest.issues.removeAssignees({
                    ...context.repo,
                    issue_number: issueNumber,
                    assignees: issue.assignees.map(a => a.login)
                  });
                }

                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `⚠️ @${context.payload.sender.login}: This issue was previously closed. Reopened issues cannot be claimed automatically.\n\nA mentor must review and re-approve this issue before any \`/claim\` is accepted.`
                });
              }
            }

